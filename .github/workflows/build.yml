name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile and test
        run: gradle clean test devBundle

      - name: Upload development bundle
        uses: actions/upload-artifact@v4
        with:
          name: sixth-degree-runelite-dev
          path: build/distributions/sixth-degree-runelite-dev.zip
          if-no-files-found: error
          retention-days: 7
