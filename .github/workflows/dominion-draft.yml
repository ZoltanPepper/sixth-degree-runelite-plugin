name: Dominion RuneLite draft

on:
  push:
    branches:
      - "draft/dominion-v1"
    paths:
      - "src/main/java/com/sixthdegree/SixthDegreeDominion*.java"
      - "src/main/java/com/sixthdegree/SixthDegreeNotificationCoordinator.java"
      - "src/main/java/com/sixthdegree/SixthDegreePanel.java"
      - "src/main/java/com/sixthdegree/SixthDegreePlugin.java"
      - "src/test/java/com/sixthdegree/SixthDegreeDominion*.java"
      - "build.gradle"
      - ".github/workflows/dominion-draft.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout draft branch
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile, test and build development bundle
        run: gradle clean test devBundle

      - name: Upload Dominion development bundle
        uses: actions/upload-artifact@v4
        with:
          name: sixth-degree-dominion-runelite-dev
          path: build/distributions/sixth-degree-runelite-dev.zip
          if-no-files-found: error
          retention-days: 7
