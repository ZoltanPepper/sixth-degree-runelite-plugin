plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex('net\\.runelite.*')
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.sixthdegree.SixthDegreePluginTest'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.13.2'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.sixthdegree'
version = '0.1.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(11)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass
	jvmArgs '-ea'
	args '--developer-mode', '--debug'
}

tasks.register('devLauncherJar', Jar) {
	dependsOn tasks.named('testClasses')
	archiveBaseName = 'sixth-degree-runelite-dev'
	archiveClassifier = 'launcher'
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	manifest {
		attributes 'Main-Class': pluginMainClass
	}
}

tasks.register('devBundle', Zip) {
	dependsOn tasks.named('devLauncherJar')
	archiveFileName = 'sixth-degree-runelite-dev.zip'
	destinationDirectory = layout.buildDirectory.dir('distributions')

	from(tasks.named('devLauncherJar')) {
		into 'app'
		rename { 'sixth-degree-runelite-dev.jar' }
	}

	from({ configurations.testRuntimeClasspath.files.findAll { it.isFile() && it.name.endsWith('.jar') } }) {
		into 'app/lib'
	}

	from('dev/run-sixth-degree.bat')
	from('dev/README.txt')
}
